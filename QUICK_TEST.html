<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quick Test Giỏ hàng</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 30px;
            text-align: center;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .test-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-card h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .test-card button {
            display: block;
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 10px;
            transition: background 0.3s;
        }
        .test-card button:hover {
            background: #4338ca;
        }
        .test-card small {
            display: block;
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }
        .result-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
            max-height: 600px;
            overflow-y: auto;
            border-left: 4px solid #4f46e5;
        }
        .success {
            color: #10b981;
            font-weight: 600;
        }
        .error {
            color: #ef4444;
            font-weight: 600;
        }
        .info {
            color: #3b82f6;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Quick Test Giỏ Hàng</h1>
        
        <div class="test-grid">
            <div class="test-card">
                <h3>1️⃣ Thêm Sản Phẩm</h3>
                <button onclick="addTestProduct()">Thêm Test Product 1</button>
                <button onclick="addTestProduct2()">Thêm Test Product 2</button>
                <button onclick="addTestProduct3()">Thêm Test Product 3</button>
                <small>Thêm 3 sản phẩm khác nhau vào giỏ hàng</small>
            </div>
            
            <div class="test-card">
                <h3>2️⃣ Kiểm Tra Giỏ</h3>
                <button onclick="checkCart()">Xem Dữ Liệu Giỏ</button>
                <button onclick="checkCartCount()">Đếm Số Sản Phẩm</button>
                <button onclick="checkElements()">Kiểm Tra HTML Elements</button>
                <small>Kiểm tra dữ liệu và element</small>
            </div>
            
            <div class="test-card">
                <h3>3️⃣ Mở Giỏ Hàng</h3>
                <button onclick="openCartTest()">Mở Giỏ Hàng</button>
                <button onclick="closeCartTest()">Đóng Giỏ Hàng</button>
                <button onclick="clearAll()">Xóa Tất Cả</button>
                <small>Mở/Đóng sidebar giỏ hàng</small>
            </div>
        </div>
        
        <div class="result-box" id="result">
            <span class="info">📝 Nhấn các nút bên trên để test...\n</span>
        </div>
    </div>

    <script>
        function log(msg, type = 'info') {
            const result = document.getElementById('result');
            const span = document.createElement('span');
            span.className = type;
            span.textContent = msg + '\n';
            result.appendChild(span);
            result.scrollTop = result.scrollHeight;
        }

        function clear() {
            document.getElementById('result').innerHTML = '';
        }

        function addTestProduct() {
            clear();
            const product = {
                id: 101,
                name: 'iPhone 15 Pro - Test',
                price: 32990000,
                image: 'https://via.placeholder.com/150?text=iPhone+15',
                quantity: 1
            };
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const exists = cart.find(i => i.id === product.id);
            if (exists) {
                exists.quantity++;
            } else {
                cart.push(product);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            log('✅ Thêm thành công: iPhone 15 Pro - Test', 'success');
            log('💾 Giỏ hiện có ' + cart.length + ' loại sản phẩm', 'info');
        }

        function addTestProduct2() {
            clear();
            const product = {
                id: 102,
                name: 'Samsung Galaxy S24 - Test',
                price: 27990000,
                image: 'https://via.placeholder.com/150?text=Samsung+S24',
                quantity: 1
            };
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const exists = cart.find(i => i.id === product.id);
            if (exists) {
                exists.quantity++;
            } else {
                cart.push(product);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            log('✅ Thêm thành công: Samsung Galaxy S24 - Test', 'success');
            log('💾 Giỏ hiện có ' + cart.length + ' loại sản phẩm', 'info');
        }

        function addTestProduct3() {
            clear();
            const product = {
                id: 103,
                name: 'Xiaomi 14 Pro - Test',
                price: 19990000,
                image: 'https://via.placeholder.com/150?text=Xiaomi+14',
                quantity: 2
            };
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const exists = cart.find(i => i.id === product.id);
            if (exists) {
                exists.quantity++;
            } else {
                cart.push(product);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            log('✅ Thêm thành công: Xiaomi 14 Pro - Test', 'success');
            log('💾 Giỏ hiện có ' + cart.length + ' loại sản phẩm', 'info');
        }

        function checkCart() {
            clear();
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                log('⚠️  Giỏ hàng trống!', 'error');
                return;
            }
            log('✅ Giỏ hàng chứa ' + cart.length + ' loại sản phẩm:', 'success');
            cart.forEach((item, i) => {
                log(`  ${i+1}. ${item.name} x${item.quantity} = ${item.price * item.quantity} đ`, 'info');
            });
            const total = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            log(`💰 Tổng tiền: ${total} đ`, 'success');
        }

        function checkCartCount() {
            clear();
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const total = cart.reduce((sum, i) => sum + i.quantity, 0);
            log(`✅ Tổng số sản phẩm: ${total}`, 'success');
            log(`📦 Loại sản phẩm: ${cart.length}`, 'info');
        }

        function checkElements() {
            clear();
            const checks = [
                { id: 'cart-btn', name: 'Nút Giỏ Hàng' },
                { id: 'cart-sidebar', name: 'Sidebar Giỏ Hàng' },
                { id: 'cart-items', name: 'Container Sản Phẩm' },
                { id: 'cart-total', name: 'Tổng Tiền' },
                { id: 'close-cart', name: 'Nút Đóng' },
                { id: 'continue-shopping', name: 'Nút Tiếp Tục Mua' }
            ];
            
            checks.forEach(check => {
                const el = document.getElementById(check.id);
                if (el) {
                    log(`✅ ${check.name} (#${check.id}) - OK`, 'success');
                } else {
                    log(`❌ ${check.name} (#${check.id}) - KHÔNG TÌM THẤY`, 'error');
                }
            });
        }

        function openCartTest() {
            clear();
            log('📂 Đang mở giỏ hàng...', 'info');
            const cartBtn = document.getElementById('cart-btn');
            if (!cartBtn) {
                log('❌ Không tìm thấy #cart-btn', 'error');
                return;
            }
            try {
                cartBtn.click();
                log('✅ Gọi cartBtn.click() thành công', 'success');
                setTimeout(() => {
                    const cartSidebar = document.getElementById('cart-sidebar');
                    if (cartSidebar) {
                        const hasActive = cartSidebar.classList.contains('active');
                        if (hasActive) {
                            log('✅ Sidebar có class "active" - ĐANG MỞ', 'success');
                        } else {
                            log('❌ Sidebar KHÔNG có class "active" - KHÔNG MỞ', 'error');
                        }
                    }
                }, 200);
            } catch (e) {
                log('❌ Lỗi: ' + e.message, 'error');
            }
        }

        function closeCartTest() {
            clear();
            const cartSidebar = document.getElementById('cart-sidebar');
            if (cartSidebar) {
                cartSidebar.classList.remove('active');
                log('✅ Sidebar đã bị remove class "active" - ĐÓNG', 'success');
            }
            document.body.style.overflow = 'auto';
        }

        function clearAll() {
            clear();
            localStorage.removeItem('cart');
            const cartSidebar = document.getElementById('cart-sidebar');
            if (cartSidebar) {
                cartSidebar.classList.remove('active');
            }
            document.body.style.overflow = 'auto';
            log('✅ Đã xóa giỏ hàng', 'success');
            log('✅ Đã đóng sidebar', 'success');
        }

        // Load trang
        window.onload = () => {
            clear();
            log('🎉 Trang test đã sẵn sàng!', 'success');
            log('Hãy thử thêm sản phẩm để test giỏ hàng', 'info');
        };
    </script>
</body>
</html>
