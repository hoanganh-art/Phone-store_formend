<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giỏ Hàng Test</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        .test-section { background: white; padding: 20px; margin: 20px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .test-section h2 { margin-bottom: 15px; color: #333; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:hover { background: #4338ca; }
        .log-box { background: #f0f0f0; padding: 15px; margin-top: 15px; border-radius: 4px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; font-size: 12px; }
        .success { color: #10b981; font-weight: bold; }
        .error { color: #ef4444; font-weight: bold; }
        .info { color: #3b82f6; font-weight: bold; }
        .warning { color: #f59e0b; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Kiểm Tra Giỏ Hàng</h1>
        
        <div class="test-section">
            <h2>1. Thêm Sản Phẩm</h2>
            <div class="btn-group">
                <button onclick="addProduct(1, 'iPhone 15', 32990000)">Thêm iPhone 15</button>
                <button onclick="addProduct(2, 'Samsung S24', 27990000)">Thêm Samsung S24</button>
                <button onclick="addProduct(3, 'Xiaomi 14', 19990000)">Thêm Xiaomi 14</button>
                <button onclick="viewCart()">Xem Giỏ</button>
                <button onclick="clearCart()">Xóa Giỏ</button>
            </div>
            <div class="log-box" id="log1"></div>
        </div>

        <div class="test-section">
            <h2>2. Kiểm Tra Elements</h2>
            <div class="btn-group">
                <button onclick="checkElements()">Kiểm Tra Elements</button>
                <button onclick="testCartBtn()">Test #cart-btn</button>
                <button onclick="testSidebar()">Test #cart-sidebar</button>
            </div>
            <div class="log-box" id="log2"></div>
        </div>

        <div class="test-section">
            <h2>3. Mở Giỏ Hàng</h2>
            <div class="btn-group">
                <button onclick="openCart()">Mở Giỏ</button>
                <button onclick="closeCart()">Đóng Giỏ</button>
            </div>
            <div class="log-box" id="log3"></div>
        </div>
    </div>

    <!-- Cart Sidebar từ index.html -->
    <div class="sidebar cart-sidebar" id="cart-sidebar">
        <div class="sidebar-backdrop"></div>
        <div class="sidebar-content">
            <div class="cart-header">
                <h3>Giỏ hàng của bạn</h3>
                <button class="modal-close" id="close-cart">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="cart-items" id="cart-items">
                <!-- Cart items will be loaded here -->
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Tổng cộng:</span>
                    <span id="cart-total">0 đ</span>
                </div>
                <div class="cart-actions">
                    <button class="btn btn-primary" id="checkout-btn">
                        <i class="fas fa-credit-card"></i>
                        Thanh toán
                    </button>
                    <button class="btn btn-outline" id="continue-shopping">
                        Tiếp tục mua sắm
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/style.js"></script>
    <script>
        // Các hàm test
        function log(msg, type = 'info', logId = 'log1') {
            const box = document.getElementById(logId);
            const span = document.createElement('div');
            span.className = type;
            span.textContent = msg;
            box.appendChild(span);
            box.appendChild(document.createElement('br'));
            box.scrollTop = box.scrollHeight;
        }

        function addProduct(id, name, price) {
            document.getElementById('log1').innerHTML = '';
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const exists = cart.find(i => i.id === id);
            
            if (exists) {
                exists.quantity++;
                log('✅ Tăng số lượng: ' + name, 'success');
            } else {
                cart.push({ id, name, price, quantity: 1, image: 'https://via.placeholder.com/100' });
                log('✅ Thêm mới: ' + name, 'success');
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            if (typeof updateCartCount === 'function') {
                updateCartCount();
                log('✅ Cập nhật badge', 'success');
            }
            log('💾 Giỏ: ' + JSON.stringify(cart).substring(0, 100) + '...', 'info');
        }

        function viewCart() {
            document.getElementById('log1').innerHTML = '';
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                log('⚠️  Giỏ trống', 'warning');
                return;
            }
            log('✅ Giỏ có ' + cart.length + ' sản phẩm:', 'success');
            cart.forEach(item => {
                log(`  - ${item.name} x${item.quantity}`, 'info');
            });
        }

        function clearCart() {
            document.getElementById('log1').innerHTML = '';
            localStorage.removeItem('cart');
            log('✅ Giỏ đã được xóa', 'success');
        }

        function checkElements() {
            document.getElementById('log2').innerHTML = '';
            const elements = ['cart-btn', 'cart-sidebar', 'cart-items', 'cart-total', 'close-cart', 'continue-shopping'];
            elements.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    log(`✅ #${id} - OK`, 'success', 'log2');
                } else {
                    log(`❌ #${id} - KHÔNG FOUND`, 'error', 'log2');
                }
            });
        }

        function testCartBtn() {
            document.getElementById('log2').innerHTML = '';
            const cartBtn = document.getElementById('cart-btn');
            if (!cartBtn) {
                // Fake button để test
                const fakeBtn = document.createElement('button');
                fakeBtn.id = 'cart-btn';
                fakeBtn.innerHTML = '<i class="fas fa-shopping-cart"></i> <span class="badge" id="cart-count">0</span>';
                document.body.appendChild(fakeBtn);
                log('⚠️  Tạo fake #cart-btn (không có trong page)', 'warning', 'log2');
            } else {
                log('✅ #cart-btn exists', 'success', 'log2');
                log('   HTML: ' + cartBtn.outerHTML.substring(0, 50) + '...', 'info', 'log2');
            }
        }

        function testSidebar() {
            document.getElementById('log2').innerHTML = '';
            const sidebar = document.getElementById('cart-sidebar');
            if (!sidebar) {
                log('❌ #cart-sidebar NOT FOUND', 'error', 'log2');
                return;
            }
            log('✅ #cart-sidebar found', 'success', 'log2');
            log('   Class: ' + sidebar.className, 'info', 'log2');
            log('   Active: ' + sidebar.classList.contains('active'), 'info', 'log2');
            const content = sidebar.querySelector('.sidebar-content');
            if (content) {
                log('✅ .sidebar-content found', 'success', 'log2');
            } else {
                log('❌ .sidebar-content NOT FOUND', 'error', 'log2');
            }
        }

        function openCart() {
            document.getElementById('log3').innerHTML = '';
            try {
                if (typeof displayCart === 'function') {
                    displayCart();
                    log('✅ displayCart() gọi thành công', 'success', 'log3');
                } else {
                    log('⚠️  displayCart() không tồn tại', 'warning', 'log3');
                }
                
                const sidebar = document.getElementById('cart-sidebar');
                if (sidebar) {
                    sidebar.classList.add('active');
                    log('✅ Thêm class "active" vào sidebar', 'success', 'log3');
                    setTimeout(() => {
                        const hasActive = sidebar.classList.contains('active');
                        log('✅ Sidebar active: ' + hasActive, 'success', 'log3');
                    }, 100);
                } else {
                    log('❌ #cart-sidebar NOT FOUND', 'error', 'log3');
                }
                
                document.body.style.overflow = 'hidden';
                log('✅ Đặt body overflow = hidden', 'success', 'log3');
            } catch (e) {
                log('❌ Lỗi: ' + e.message, 'error', 'log3');
            }
        }

        function closeCart() {
            document.getElementById('log3').innerHTML = '';
            const sidebar = document.getElementById('cart-sidebar');
            if (sidebar) {
                sidebar.classList.remove('active');
                log('✅ Remove class "active"', 'success', 'log3');
            }
            document.body.style.overflow = 'auto';
            log('✅ Đặt body overflow = auto', 'success', 'log3');
        }

        // Init
        window.onload = () => {
            document.getElementById('log1').innerHTML = '<span class="info">Sẵn sàng test...</span>';
        };
    </script>
</body>
</html>
